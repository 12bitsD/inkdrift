[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "inkdrift-worker"
version = "0.1.0"
description = "Nextloop worker for Inkdrift"
requires-python = ">=3.11"
dependencies = [
  "nextloop==1.0.0",
]

[project.optional-dependencies]
dev = [
  "mypy==2.4.1",
  "ruff==0.17.4",
]
build = [
  "pyinstaller==6.22.3",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["inkdrift_worker"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "SIM"]
