name: build

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            artifact: macos-universal
          - os: windows-latest
            artifact: windows-x64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.5.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          python -m venv .venv
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            .venv/Scripts/python -m pip install -e 'worker[dev,build]'
          else
            .venv/bin/python -m pip install -e 'worker[dev,build]'
          fi
      - name: Check TypeScript and UI
        run: |
          pnpm lint
          pnpm build
          pnpm peers check
      - name: Check Python worker
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            .venv/Scripts/python -m mypy worker/src
            .venv/Scripts/python -m ruff check worker
            .venv/Scripts/python -m ruff format --check worker
          else
            .venv/bin/python -m mypy worker/src
            .venv/bin/python -m ruff check worker
            .venv/bin/python -m ruff format --check worker
          fi
      - name: Build worker for checks
        if: runner.os == 'macOS'
        run: pnpm build:worker
      - name: Package macOS x64
        if: runner.os == 'macOS' && github.event_name != 'pull_request'
        run: |
          pnpm exec electron-builder --x64 --publish never
          mv release release-x64
      - name: Verify macOS x64 worker
        if: runner.os == 'macOS' && github.event_name != 'pull_request'
        run: |
          python - <<'PY'
          import re, subprocess
          path = subprocess.check_output(['find', 'release-x64', '-type', 'f', '-name', 'inkdrift-worker', '-print', '-quit'], text=True).strip()
          assert path, 'No x64 worker found in packaged app'
          output = subprocess.check_output(['file', path], text=True)
          print(output)
          assert re.search(r'Mach-O.*\bx86_64\b', output), output
          PY
      - name: Smoke macOS x64 worker
        if: runner.os == 'macOS'
        run: |
          python - <<'PY'
          import json, subprocess
          result = subprocess.run(['worker/dist/inkdrift-worker/inkdrift-worker'], input='{}', text=True, capture_output=True, timeout=15, check=False)
          assert result.returncode == 1, (result.returncode, result.stderr)
          assert json.loads(result.stdout)['code'] == 'invalid-input', result.stdout
          print('x64 Nextloop worker starts and validates stdio input.')
          PY
      - name: Build rpds for arm64
        if: runner.os == 'macOS' && github.event_name != 'pull_request'
        run: |
          rustup target add aarch64-apple-darwin
          CARGO_BUILD_TARGET=aarch64-apple-darwin MACOSX_DEPLOYMENT_TARGET=11.0 .venv/bin/python -m pip install --force-reinstall --no-binary rpds-py rpds-py==0.27.1
      - name: Package macOS arm64
        if: runner.os == 'macOS' && github.event_name != 'pull_request'
        run: |
          INKDRIFT_WORKER_ARCH=arm64 pnpm build:worker
          pnpm exec electron-builder --arm64 --publish never
          mv release release-arm64
      - name: Verify macOS arm64 worker
        if: runner.os == 'macOS' && github.event_name != 'pull_request'
        run: |
          python - <<'PY'
          import re, subprocess
          path = subprocess.check_output(['find', 'release-arm64', '-type', 'f', '-name', 'inkdrift-worker', '-print', '-quit'], text=True).strip()
          assert path, 'No arm64 worker found in packaged app'
          output = subprocess.check_output(['file', path], text=True)
          print(output)
          assert re.search(r'Mach-O.*\barm64\b', output), output
          PY
      - name: Package Windows application
        if: runner.os == 'Windows' && github.event_name != 'pull_request'
        run: |
          pnpm build:worker
          pnpm exec electron-builder --publish never
      - name: Smoke packaged worker
        if: runner.os == 'Windows' && github.event_name != 'pull_request'
        run: |
          python - <<'PY'
          import json, subprocess
          result = subprocess.run(['worker/dist/inkdrift-worker/inkdrift-worker.exe'], input='{}', text=True, capture_output=True, timeout=15, check=False)
          assert result.returncode == 1, (result.returncode, result.stderr)
          assert json.loads(result.stdout)['code'] == 'invalid-input', result.stdout
          print('Packaged Nextloop worker starts and validates stdio input.')
          PY
      - if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: inkdrift-${{ matrix.artifact }}
          path: |
            release*/*.zip
            release*/*.exe
          if-no-files-found: error
